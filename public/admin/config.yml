backend:
  name: github
  repo: giovanizanetti/bambasrodadesamba
  branch: main
  base_url: https://sveltia-cms-auth.zanetti-giovani.workers.dev

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: shows
    label: Shows
    label_singular: Show
    folder: content/shows
    format: json
    extension: json
    create: true
    slug: '{{fields.date}}-{{slug}}'
    identifier_field: title
    summary: '{{fields.date}} — {{fields.title}}'
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    fields:
      - name: date
        label: Date
        widget: datetime
        type: date
        hint: 'The day after the show, it moves from Upcoming shows to Past shows.'
      - name: startTime
        label: Start time
        widget: datetime
        type: time
        format: 'HH:mm'
        required: false
        hint: 'For a festival or multi-act night, the time of the whole event; our own slot goes in "We play from / until" below.'
      - name: endTime
        label: End time
        widget: datetime
        type: time
        format: 'HH:mm'
        required: false
        hint: 'Leave empty to show only the start time.'
      - name: playStart
        label: We play from
        widget: datetime
        type: time
        format: 'HH:mm'
        required: false
        hint: 'Only for festivals or events with other acts. Leave empty if the times above are already our own.'
      - name: playEnd
        label: We play until
        widget: datetime
        type: time
        format: 'HH:mm'
        required: false
      - name: title
        label: Title
        widget: string
      - name: title_nl
        label: Title (Nederlands)
        widget: string
        required: false
        hint: 'Leave empty to use the main title'
      - name: title_pt
        label: Title (Português)
        widget: string
        required: false
        hint: 'Leave empty to use the main title'
      - name: subtitle
        label: Subtitle
        widget: string
        required: false
        hint: 'Small line under the title, e.g. what the show is part of'
      - name: subtitle_nl
        label: Subtitle (Nederlands)
        widget: string
        required: false
      - name: subtitle_pt
        label: Subtitle (Português)
        widget: string
        required: false
      - name: venue
        label: Venue name
        widget: string
        hint: 'Just the name, e.g. Café De Hartjes. The address goes in the Google Maps link below.'
      - name: city
        label: City
        widget: string
        hint: 'e.g. Amsterdam. The site shows 📍 Café De Hartjes · Amsterdam'
      - name: free
        label: Free entry
        widget: boolean
        default: false
        required: false
      - name: cancelled
        label: Cancelled
        widget: boolean
        default: false
        required: false
        hint: 'Shows the event struck through with a Cancelled badge'
      - name: comingSoon
        label: More info coming soon
        widget: boolean
        default: false
        required: false
        hint: 'Shows "More info soon" instead of the More info button, until the details or poster are ready.'
      - name: eventUrl
        label: Event page URL
        widget: string
        required: false
        type: url
        pattern: ['^https://', 'Paste the full link, starting with https://']
        hint: 'e.g. the organizer''s page. Shown as a small link on the show''s own page.'
      - name: ticketUrl
        label: Ticket URL
        widget: string
        required: false
        type: url
        pattern: ['^https://', 'Paste the full link, starting with https://']
        hint: 'Shows a Tickets / Free ticket button'
      - name: ticketEmbed
        label: Ticket shop embed (Weeztix)
        widget: text
        required: false
        hint: 'Paste the Weeztix embed code here. The Tickets button then opens a ticket page on our own site instead of the Weeztix website.'
      - name: image
        label: Poster / flyer
        widget: image
        required: false
        hint: 'Shown on the show''s own page, under the show details'
      - name: mapsUrl
        label: Google Maps URL
        widget: string
        required: false
        type: url
        pattern: ['^https://', 'Paste the full link, starting with https://']
        hint: 'Makes the venue name a link to the map'
